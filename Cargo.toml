[workspace]
resolver = "2"
members = [
    "core_domain",
    "storage",
    "axum_adapter",
    "wasi_adapter",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
